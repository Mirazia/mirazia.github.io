<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>工具导航</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f5f7;
      --bg2: #ffffff;
      --bg3: #f0f0f2;
      --border: #e0e0e5;
      --text: #1a1a1e;
      --muted: #888899;
      --radius: 14px;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px 40px;
    }

    /* ── Search ── */
    .search-wrap {
      width: 100%;
      max-width: 560px;
      margin-bottom: 56px;
    }

    .site-title {
      text-align: center;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: .5px;
      margin-bottom: 24px;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 6px 6px 20px;
      gap: 8px;
      transition: border-color .2s;
    }

    .search-box:focus-within {
      border-color: #555;
    }

    .search-box input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 1rem;
      font-family: inherit;
    }

    .search-box input::placeholder { color: var(--muted); }

    .search-engine {
      display: flex;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 999px;
      overflow: hidden;
    }

    .search-engine label {
      padding: 7px 13px;
      font-size: .78rem;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }

    .search-engine input[type="radio"] { display: none; }

    .search-engine input[type="radio"]:checked + label {
      background: #1a1a1e;
      color: #fff;
    }

    .search-btn {
      background: #1a1a1e;
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 8px 18px;
      font-size: .9rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: opacity .15s;
    }

    .search-btn:hover { opacity: .85; }

    /* ── Nav Grid ── */
    .nav-section {
      width: 100%;
      max-width: 860px;
      margin-bottom: 40px;
    }

    .section-label {
      font-size: .75rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 12px;
      padding-left: 4px;
    }

    .nav-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 10px;
    }

    .nav-card {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 13px 14px;
      text-decoration: none;
      color: var(--text);
      font-size: .9rem;
      font-weight: 500;
      transition: all .18s;
      overflow: hidden;
    }

    .nav-card:hover {
      border-color: #444;
      background: var(--bg3);
      transform: translateY(-1px);
    }

    .nav-card .icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .nav-card .name { line-height: 1.2; }
    .nav-card .desc { font-size: .75rem; color: var(--muted); margin-top: 1px; }

    /* icon bg colors */
    .ic-red   { background: rgba(255,59,48,.15); }
    .ic-pink  { background: rgba(255,45,85,.15); }
    .ic-blue  { background: rgba(0,122,255,.15); }
    .ic-green { background: rgba(52,199,89,.15); }
    .ic-orange{ background: rgba(255,149,0,.15); }
    .ic-purple{ background: rgba(175,82,222,.15); }
    .ic-teal  { background: rgba(90,200,250,.15); }
    .ic-yellow{ background: rgba(255,214,10,.15); }
    .ic-gray  { background: rgba(142,142,147,.15); }

    footer {
      margin-top: auto;
      padding-top: 40px;
      color: var(--muted);
      font-size: .78rem;
    }
  </style>
</head>
<body>

  <!-- Search -->
  <div class="search-wrap">
    <p class="site-title">导航</p>
    <form class="search-box" id="searchForm" onsubmit="doSearch(event)">
      <input type="text" id="searchInput" placeholder="搜索..." autocomplete="off" />
      <div class="search-engine">
        <input type="radio" name="eng" id="g" value="https://www.google.com/search?q=" checked />
        <label for="g">Google</label>
        <input type="radio" name="eng" id="b" value="https://www.bing.com/search?q=" />
        <label for="b">Bing</label>
      </div>
      <button class="search-btn" type="submit">搜索</button>
    </form>
  </div>

  <!-- 我的工具 -->
  <div class="nav-section">
    <div class="section-label">我的工具</div>
    <div class="nav-grid">
      <a href="https://mirazia.github.io/toolsite/tiktok.html" class="nav-card" target="_blank">
        <div class="icon ic-pink">
          <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18" style="color:#ff2d55">
            <path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1V9.01a6.28 6.28 0 00-.79-.05 6.34 6.34 0 00-6.34 6.34 6.34 6.34 0 006.34 6.34 6.34 6.34 0 006.33-6.34V8.75a8.18 8.18 0 004.78 1.52V6.82a4.85 4.85 0 01-1.01-.13z"/>
          </svg>
        </div>
        <div><div class="name">TikTok 下载</div><div class="desc">无水印视频</div></div>
      </a>
      <a href="https://mirazia.github.io/toolsite/youtube.html" class="nav-card" target="_blank">
        <div class="icon ic-red">
          <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18" style="color:#ff0000">
            <path d="M23.498 6.186a3.016 3.016 0 00-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 00.502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 002.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 002.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
          </svg>
        </div>
        <div><div class="name">YouTube 下载</div><div class="desc">支持 4K / MP3</div></div>
      </a>
    </div>
  </div>

  <!-- 常用网站 -->
  <div class="nav-section">
    <div class="section-label">常用</div>
    <div class="nav-grid">
      <a href="https://github.com" class="nav-card" target="_blank">
        <div class="icon ic-gray">🐙</div>
        <div><div class="name">GitHub</div><div class="desc">代码托管</div></div>
      </a>
      <a href="https://chat.openai.com" class="nav-card" target="_blank">
        <div class="icon ic-green">🤖</div>
        <div><div class="name">ChatGPT</div><div class="desc">AI 对话</div></div>
      </a>
      <a href="https://claude.ai" class="nav-card" target="_blank">
        <div class="icon ic-orange">✦</div>
        <div><div class="name">Claude</div><div class="desc">AI 助手</div></div>
      </a>
      <a href="https://www.youtube.com" class="nav-card" target="_blank">
        <div class="icon ic-red">▶️</div>
        <div><div class="name">YouTube</div><div class="desc">视频平台</div></div>
      </a>
      <a href="https://www.tiktok.com" class="nav-card" target="_blank">
        <div class="icon ic-pink">🎵</div>
        <div><div class="name">TikTok</div><div class="desc">短视频</div></div>
      </a>
      <a href="https://translate.google.com" class="nav-card" target="_blank">
        <div class="icon ic-blue">🌐</div>
        <div><div class="name">翻译</div><div class="desc">Google 翻译</div></div>
      </a>
      <a href="https://www.canva.com" class="nav-card" target="_blank">
        <div class="icon ic-purple">🎨</div>
        <div><div class="name">Canva</div><div class="desc">在线设计</div></div>
      </a>
      <a href="https://notion.so" class="nav-card" target="_blank">
        <div class="icon ic-gray">📝</div>
        <div><div class="name">Notion</div><div class="desc">笔记 & 文档</div></div>
      </a>
    </div>
  </div>

  <!-- 开发工具 -->
  <div class="nav-section">
    <div class="section-label">开发</div>
    <div class="nav-grid">
      <a href="https://codepen.io" class="nav-card" target="_blank">
        <div class="icon ic-teal">💻</div>
        <div><div class="name">CodePen</div><div class="desc">前端演示</div></div>
      </a>
      <a href="https://stackoverflow.com" class="nav-card" target="_blank">
        <div class="icon ic-orange">📚</div>
        <div><div class="name">Stack Overflow</div><div class="desc">技术问答</div></div>
      </a>
      <a href="https://vercel.com" class="nav-card" target="_blank">
        <div class="icon ic-gray">▲</div>
        <div><div class="name">Vercel</div><div class="desc">免费部署</div></div>
      </a>
      <a href="https://regex101.com" class="nav-card" target="_blank">
        <div class="icon ic-yellow">🔍</div>
        <div><div class="name">Regex101</div><div class="desc">正则测试</div></div>
      </a>
    </div>
  </div>

  <footer>自用导航 · 随时可改</footer>

  <script>
    function doSearch(e) {
      e.preventDefault();
      const q = document.getElementById('searchInput').value.trim();
      if (!q) return;
      const eng = document.querySelector('input[name="eng"]:checked').value;
      window.open(eng + encodeURIComponent(q), '_blank');
    }
  </script>
</body>
</html>
